<meta charset="utf-8">

<title>{% if post.title %}{{ post.title }} | {{ page.title }}{% else %}{{ site.title }}{% endif %}</title>

<meta name="author" content="{{ site.author }}">
<meta name="description" content="{{ site.description }}">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css">
<!-- jQuery -->
<script src="{{ site.baseurl }}/assets/js/jquery-1.11.1.min.js"></script>

<!-- If the query includes 'print-pdf', include the PDF print sheet -->
<script>
	if( window.location.search.match( /print-pdf/gi ) ) {
		var link = document.createElement( 'link' );
		link.rel = 'stylesheet';
		link.type = 'text/css';
		link.href = '{{ site.baseurl }}/reveal.js/css/print/pdf.css';
		document.getElementsByTagName( 'head' )[0].appendChild( link );

		// Open the browser print dialog once reveal has laid out the pages,
		// so ?print-pdf goes straight to "Save as PDF".
		window.addEventListener( 'load', function() {
			var openPrint = function() {
				setTimeout( function() { window.print(); }, 600 );
			};
			if( window.Reveal && typeof Reveal.addEventListener === 'function' ) {
				Reveal.addEventListener( 'ready', openPrint );
				if( Reveal.isReady && Reveal.isReady() ) openPrint();
			} else {
				openPrint();
			}
		});
	}
</script>
